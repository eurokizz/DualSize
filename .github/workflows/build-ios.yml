name: 🏗️ Build DualSize Agent IPA

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'ios_agent/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ios_agent/**'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      sign_ipa:
        description: 'Sign IPA (requires certificates)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_PATH: ios_agent/DualSizeAgent.xcodeproj
  SCHEME: DualSizeAgent
  BUNDLE_ID: com.feelarecorp.dualsize
  IPA_NAME: DualSizeAgent

jobs:
  # ─────────────────────────────────────────
  # Job 1: Lint and validate
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Swift Lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          cd ios_agent
          swiftlint --reporter github-actions-logging || true

  # ─────────────────────────────────────────
  # Job 2: Build (unsigned IPA for sideload)
  # ─────────────────────────────────────────
  build:
    name: 🔨 Build IPA
    runs-on: macos-15
    needs: lint
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          xcodebuild -version

      - name: Show build environment
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          echo "=== Available Simulators ==="
          xcrun simctl list devicetypes | grep iPhone | head -10

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('ios_agent/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios_agent/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ── Build for generic device (no signing) ──
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          DERIVED_DATA_PATH="${{ github.workspace }}/DerivedData"

          # Download iOS platform if needed
          xcodebuild -downloadPlatform iOS 2>/dev/null || true

          xcodebuild \
            -project ${{ env.PROJECT_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ENABLE_BITCODE=NO \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            clean build \
            2>&1 | tee build.log | xcpretty --color || {
              echo "::error::xcodebuild failed — last 50 lines:"
              tail -50 build.log
              exit 1
            }

          echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> $GITHUB_ENV

      # ── Locate .app ──
      - name: Locate built .app
        run: |
          echo "=== Searching for .app in DerivedData ==="
          find "$DERIVED_DATA_PATH" -name "*.app" -not -path "*/Intermediates/*" -not -path "*iphonesimulator*" 2>/dev/null || true

          APP_PATH=$(find "$DERIVED_DATA_PATH" \
            -name "DualSizeAgent.app" \
            -not -path "*/Intermediates/*" \
            -not -path "*iphonesimulator*" \
            2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            # Fallback: any .app for iphoneos
            APP_PATH=$(find "$DERIVED_DATA_PATH" \
              -name "*.app" \
              -path "*iphoneos*" \
              -not -path "*/Intermediates/*" \
              2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find .app bundle!"
            echo "=== DerivedData structure ==="
            find "$DERIVED_DATA_PATH" -maxdepth 6 -type d | head -30
            exit 1
          fi

          echo "Found .app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      # ── Package .app into .ipa ──
      - name: Package .app into unsigned IPA
        run: |
          echo "Packaging: $APP_PATH"

          PAYLOAD_DIR="${{ github.workspace }}/Payload"
          IPA_PATH="${{ github.workspace }}/${{ env.IPA_NAME }}_unsigned.ipa"

          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "${{ github.workspace }}"
          zip -r "$IPA_PATH" Payload/
          rm -rf Payload/

          echo "=== IPA created ==="
          ls -lh "$IPA_PATH"
          echo "=== Contents ==="
          unzip -l "$IPA_PATH" | head -20

      # ── Generate build report ──
      - name: Generate build report
        if: always()
        run: |
          xcpretty --color < build.log > build_report.html 2>/dev/null || cp build.log build_report.html

      # ── Upload artifacts ──
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DualSizeAgent-unsigned-${{ github.sha }}
          path: ${{ github.workspace }}/${{ env.IPA_NAME }}_unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-report-${{ github.sha }}
          path: build_report.html
          retention-days: 7

  # ─────────────────────────────────────────
  # Job 3: Signed IPA (optional, with secrets)
  # ─────────────────────────────────────────
  sign:
    name: ✍️ Sign IPA (AltStore / Sideload)
    runs-on: macos-15
    needs: build
    if: github.event.inputs.sign_ipa == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: DualSizeAgent-unsigned-${{ github.sha }}

      # Setup certificates from secrets
      - name: Setup signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::notice::No signing certificate provided, skipping cert setup"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > cert.p12
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          echo "HAS_CERT=true" >> $GITHUB_ENV

      # Sign or fake-sign
      - name: Sign IPA
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "Signing with certificate..."
            brew tap zhlynn/zsign 2>/dev/null || true
            brew install zsign 2>/dev/null || (
              git clone https://github.com/zhlynn/zsign.git zsign_src &&
              cd zsign_src && make &&
              sudo cp zsign /usr/local/bin/ &&
              cd ..
            )
            zsign \
              -k cert.p12 \
              -p "$P12_PASSWORD" \
              -m profile.mobileprovision \
              -o DualSizeAgent_signed.ipa \
              -f \
              DualSizeAgent_unsigned.ipa
          else
            echo "::notice::No certificate found. Packaging unsigned IPA as signed for AltStore/Sideloadly."
            cp DualSizeAgent_unsigned.ipa DualSizeAgent_signed.ipa
          fi

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: DualSizeAgent-signed-${{ github.sha }}
          path: DualSizeAgent_signed.ipa
          retention-days: 90

  # ─────────────────────────────────────────
  # Job 4: Create GitHub Release
  # ─────────────────────────────────────────
  release:
    name: 🚀 Create Release
    runs-on: macos-15
    needs: [build, sign]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: DualSizeAgent-unsigned-${{ github.sha }}

      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: DualSizeAgent-signed-${{ github.sha }}
        continue-on-error: true

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 "MARKETING_VERSION" ios_agent/DualSizeAgent.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d ';')
          BUILD=$(grep -m1 "CURRENT_PROJECT_VERSION" ios_agent/DualSizeAgent.xcodeproj/project.pbxproj | awk '{print $3}' | tr -d ';')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION.$BUILD" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "DualSize Agent ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DualSize Agent ${{ steps.version.outputs.tag }}

            **iOS Screen Mirroring Agent by FL-corp.ltd**

            ### Установка

            #### Вариант 1: AltStore / AltServer
            1. Скачайте `DualSizeAgent_unsigned.ipa`
            2. Откройте AltStore на iPhone
            3. Нажмите **+** → выберите IPA файл
            4. Подпишите своим Apple ID

            #### Вариант 2: Sideloadly
            1. Скачайте и запустите [Sideloadly](https://sideloadly.io)
            2. Перетащите `DualSizeAgent_unsigned.ipa`
            3. Введите свой Apple ID
            4. Нажмите Start

            #### Вариант 3: TrollStore (iOS 14-16.6.1)
            1. Скачайте `DualSizeAgent_unsigned.ipa`
            2. В TrollStore нажмите Install IPA

            ### Что нового в ${{ steps.version.outputs.tag }}
            - Полный рефакторинг с iOS 26 Liquid Glass дизайном
            - Live Activity в Dynamic Island
            - GPS Spoofing с симуляцией маршрутов
            - Контекстные панели управления для 20+ приложений
            - Hardware H.265 энкодер через VideoToolbox

            ---
            *© 2023–2026 FL-corp.ltd · MIT License*

          files: |
            DualSizeAgent_unsigned.ipa
            DualSizeAgent_signed.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # Job 5: Simulator build for testing
  # ─────────────────────────────────────────
  test-simulator:
    name: 🧪 Test on Simulator
    runs-on: macos-15
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Boot simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16 Pro" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID" || true

      - name: Build for simulator
        run: |
          xcodebuild \
            -project ${{ env.PROJECT_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS="arm64" \
            build \
            | xcpretty

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "$DEVICE_ID" || true
